<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="referrer" content="no-referrer"><link rel="manifest" href="/manifest-admin.json"><link rel="icon" href="/images/kontanta-logo.png"><title>КОНТАНТА — панель заявок</title><style>*{box-sizing:border-box;font-style:normal}body,button,input,select{font-family:"Liberation Serif","Nimbus Roman No9 L",serif;font-style:normal}body{margin:0;background:#f3f4f6;color:#111827;font-size:17px}.wrap{width:min(1100px,calc(100% - 28px));margin:auto}.login{min-height:100vh;display:grid;place-items:center}.box{width:min(430px,100%);background:#fff;padding:29px;border:1px solid #d1d5db;border-radius:14px;box-shadow:0 15px 35px #1112}.brand{display:flex;align-items:center;gap:12px;margin-bottom:22px}.brand img{width:52px;height:52px;object-fit:contain}.brand h1{font-size:23px;margin:0}.brand p{color:#6b7280;margin:4px 0 0;font-size:14px}label{display:block;font-size:15px;font-weight:700;margin:14px 0 6px}input,select{width:100%;min-height:45px;border:1px solid #cbd5e1;border-radius:8px;padding:9px;background:#fff;font-size:16px}.btn{border:0;border-radius:8px;min-height:44px;padding:10px 16px;background:#111827;color:#fff;font-size:16px;font-weight:700;cursor:pointer}.btn:disabled{opacity:.55}.wide{width:100%;margin-top:18px}.error{min-height:20px;color:#b91c1c;font-size:14px;margin-top:10px}.app{display:none}.top{position:sticky;top:0;z-index:5;background:#111827;color:#fff;padding:12px 0}.topin{display:flex;align-items:center;justify-content:space-between;gap:12px}.top h1{font-size:20px;margin:0}.toolbar{display:flex;gap:8px}.toolbar .btn{background:#374151}.main{padding:24px 0 60px}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:18px}.stat{background:#fff;border:1px solid #d1d5db;border-radius:10px;padding:15px}.stat b{font-size:28px;display:block}.stat span{color:#6b7280;font-size:14px}.controls{display:flex;gap:10px;margin:16px 0}.controls input{max-width:430px}.cards{display:grid;gap:12px}.card{background:#fff;border:1px solid #d1d5db;border-radius:12px;padding:17px}.row{display:flex;justify-content:space-between;gap:15px;align-items:flex-start}.name{font-size:20px;font-weight:700}.phone{display:inline-block;margin-top:5px;color:#1d4ed8;font-size:18px;font-weight:700}.date,.id{color:#6b7280;font-size:13px}.message{white-space:pre-wrap;margin:13px 0;padding:10px;background:#f9fafb;border-radius:7px}.actions{display:flex;align-items:center;gap:9px;margin-top:12px}.actions select{width:200px}.danger{background:#b91c1c}.empty{text-align:center;padding:50px;background:#fff;border-radius:12px;color:#6b7280}.privacy{margin-top:24px;color:#6b7280;font-size:13px}.install{display:none}@media(max-width:760px){.stats{grid-template-columns:repeat(2,1fr)}.topin,.row{align-items:stretch}.row{flex-direction:column}.toolbar{flex-wrap:wrap}.controls,.actions{flex-direction:column}.controls input,.actions select{max-width:none;width:100%}.card{padding:14px}}</style></head><body><section class="login" id="login"><form class="box" id="loginForm"><div class="brand"><img src="/images/kontanta-logo.png" alt="Логотип КОНТАНТА"><div><h1>Панель обработки заявок</h1><p>Доступ предоставляется только уполномоченным сотрудникам</p></div></div><label for="loginInput">Логин</label><input id="loginInput" autocomplete="username" required maxlength="100"><label for="passwordInput">Пароль</label><input id="passwordInput" type="password" autocomplete="current-password" required maxlength="256"><button class="btn wide" type="submit">Войти</button><p class="error" id="loginError" role="alert"></p></form></section><section class="app" id="app"><header class="top"><div class="wrap topin"><h1>КОНТАНТА · Заявки</h1><div class="toolbar"><button class="btn install" id="install">Установить приложение</button><button class="btn" id="refresh">Обновить</button><button class="btn" id="logout">Выйти</button></div></div></header><main class="wrap main"><div class="stats" id="stats"></div><div class="controls"><input id="search" type="search" placeholder="Поиск по ФИО или номеру телефона" autocomplete="off"><select id="filter" aria-label="Фильтр заявок по статусу"><option value="">Все статусы</option><option value="new">Новые</option><option value="processing">В работе</option><option value="completed">Завершённые</option><option value="rejected">Отклонённые</option></select></div><div class="cards" id="cards"></div><p class="privacy">Персональные данные доступны только уполномоченным сотрудникам. Не копируйте их в личные мессенджеры и не храните дольше установленного срока.</p></main></section><script>'use strict';const API='/api/',login=document.getElementById('login'),app=document.getElementById('app'),form=document.getElementById('loginForm'),err=document.getElementById('loginError'),cards=document.getElementById('cards'),stats=document.getElementById('stats'),search=document.getElementById('search'),filter=document.getElementById('filter');let token=sessionStorage.getItem('kontanta_admin_token')||'',leads=[];const labels={new:'Новая',processing:'В работе',completed:'Завершена',rejected:'Отклонена'};function headers(){return{Accept:'application/json',Authorization:'Bearer '+token}}async function request(path,options={}){options.headers={...headers(),...(options.headers||{})};const response=await fetch(API+path,options);let data={};try{data=await response.json()}catch(error){}if(response.status===401){leave();throw new Error('Сессия завершена. Войдите снова.')}if(!response.ok)throw new Error(data.error||'Не удалось выполнить запрос');return data}function enter(){login.style.display='none';app.style.display='block'}function leave(){token='';sessionStorage.removeItem('kontanta_admin_token');app.style.display='none';login.style.display='grid';form.reset()}function node(tag,text,className){const element=document.createElement(tag);if(text!==undefined)element.textContent=text;if(className)element.className=className;return element}function showStats(data){stats.replaceChildren();[['total','Всего'],['new','Новые'],['processing','В работе'],['completed','Завершены'],['rejected','Отклонены']].forEach(([key,label])=>{const item=node('div',undefined,'stat');item.append(node('b',String(data[key]||0)),node('span',label));stats.append(item)})}function render(){cards.replaceChildren();const query=search.value.trim().toLowerCase(),status=filter.value,list=leads.filter(item=>(!status||(item.status||'new')===status)&&(!query||String(item.name||'').toLowerCase().includes(query)||String(item.phone||'').includes(query)));if(!list.length){cards.append(node('div','Заявки не найдены','empty'));return}list.forEach(lead=>{const card=node('article',undefined,'card'),row=node('div',undefined,'row'),left=node('div'),right=node('div');left.append(node('div',lead.name||'ФИО не указано','name'));const phone=node('a',lead.phone||'');phone.className='phone';phone.href='tel:'+String(lead.phone||'').replace(/[^+\d]/g,'');left.append(phone);right.append(node('div',new Date(lead.created_at||Date.now()).toLocaleString('ru-RU'),'date'),node('div',lead.id||'','id'));row.append(left,right);card.append(row);if(lead.message)card.append(node('div',lead.message,'message'));const actions=node('div',undefined,'actions'),select=node('select');Object.entries(labels).forEach(([value,label])=>{const option=node('option',label);option.value=value;option.selected=(lead.status||'new')===value;select.append(option)});select.onchange=async()=>{select.disabled=true;try{await request('simple-leads.php?action=status',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:lead.id,status:select.value})});lead.status=select.value;await loadStats()}catch(error){alert(error.message)}finally{select.disabled=false}};const remove=node('button','Удалить заявку','btn danger');remove.type='button';remove.onclick=async()=>{if(!confirm('Безвозвратно удалить эту заявку?'))return;remove.disabled=true;try{await request('simple-leads.php?action=delete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:lead.id})});leads=leads.filter(item=>item.id!==lead.id);render();await loadStats()}catch(error){alert(error.message)}finally{remove.disabled=false}};actions.append(select,remove);card.append(actions);cards.append(card)})}async function loadStats(){const data=await request('simple-stats.php');showStats(data.stats||{})}async function load(){const data=await request('simple-leads.php?action=list');leads=data.leads||[];render();await loadStats()}form.onsubmit=async event=>{event.preventDefault();err.textContent='';const button=form.querySelector('button');button.disabled=true;try{const response=await fetch(API+'simple-auth.php?action=login',{method:'POST',headers:{'Content-Type':'application/json',Accept:'application/json'},body:JSON.stringify({login:document.getElementById('loginInput').value,password:document.getElementById('passwordInput').value})});const data=await response.json();if(!response.ok)throw new Error(data.error||'Не удалось войти');token=data.token;sessionStorage.setItem('kontanta_admin_token',token);enter();await load()}catch(error){err.textContent=error.message}finally{button.disabled=false}};document.getElementById('refresh').onclick=()=>load().catch(error=>alert(error.message));document.getElementById('logout').onclick=async()=>{try{await request('simple-auth.php?action=logout',{method:'POST'})}catch(error){}leave()};search.oninput=render;filter.onchange=render;(async()=>{if(!token)return;try{await request('simple-auth.php?action=verify');enter();await load()}catch(error){leave()}})();let installPrompt;window.addEventListener('beforeinstallprompt',event=>{event.preventDefault();installPrompt=event;document.getElementById('install').style.display='inline-block'});document.getElementById('install').onclick=async()=>{if(installPrompt){installPrompt.prompt();await installPrompt.userChoice;installPrompt=null;document.getElementById('install').style.display='none'}};if('serviceWorker'in navigator)navigator.serviceWorker.register('/service-worker-admin.js',{scope:'/'}).catch(()=>{});</script></body></html>
