<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="referrer" content="no-referrer"><link rel="manifest" href="/manifest-admin.json"><link rel="icon" href="/images/kontanta-logo.png"><title>КОНТАНТА — заявки</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f3f4f6;color:#111827}button,input,select{font:inherit}.wrap{width:min(1100px,calc(100% - 28px));margin:auto}.login{min-height:100vh;display:grid;place-items:center}.box{width:min(420px,100%);background:#fff;padding:28px;border:1px solid #d1d5db;border-radius:14px;box-shadow:0 15px 35px #1112}.brand{display:flex;align-items:center;gap:12px;margin-bottom:22px}.brand img{width:52px;height:52px;object-fit:contain}.brand h1{font-size:21px;margin:0}.brand p,.muted{color:#6b7280;margin:4px 0 0;font-size:13px}label{display:block;font-size:13px;font-weight:700;margin:14px 0 6px}input,select{width:100%;min-height:44px;border:1px solid #cbd5e1;border-radius:8px;padding:9px;background:#fff}.btn{border:0;border-radius:8px;min-height:44px;padding:10px 16px;background:#111827;color:#fff;font-weight:700;cursor:pointer}.btn:disabled{opacity:.55}.wide{width:100%;margin-top:18px}.error{min-height:20px;color:#b91c1c;font-size:13px;margin-top:10px}.app{display:none}.top{position:sticky;top:0;z-index:5;background:#111827;color:#fff;padding:12px 0}.topin{display:flex;align-items:center;justify-content:space-between;gap:12px}.top h1{font-size:18px;margin:0}.toolbar{display:flex;gap:8px}.toolbar .btn{background:#374151}.main{padding:24px 0 60px}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:18px}.stat{background:#fff;border:1px solid #d1d5db;border-radius:10px;padding:15px}.stat b{font-size:27px;display:block}.stat span{color:#6b7280;font-size:12px}.controls{display:flex;gap:10px;margin:16px 0}.controls input{max-width:420px}.cards{display:grid;gap:12px}.card{background:#fff;border:1px solid #d1d5db;border-radius:12px;padding:17px}.row{display:flex;justify-content:space-between;gap:15px;align-items:flex-start}.name{font-size:18px;font-weight:800}.phone{display:inline-block;margin-top:5px;color:#1d4ed8;font-weight:700}.date,.id{color:#6b7280;font-size:12px}.message{white-space:pre-wrap;margin:13px 0;padding:10px;background:#f9fafb;border-radius:7px}.actions{display:flex;align-items:center;gap:9px;margin-top:12px}.actions select{width:190px}.danger{background:#b91c1c}.empty{text-align:center;padding:50px;background:#fff;border-radius:12px;color:#6b7280}.privacy{margin-top:24px;color:#6b7280;font-size:12px}.install{display:none}@media(max-width:760px){.stats{grid-template-columns:repeat(2,1fr)}.topin,.row{align-items:stretch}.row{flex-direction:column}.toolbar{flex-wrap:wrap}.controls{flex-direction:column}.controls input{max-width:none}.actions{align-items:stretch;flex-direction:column}.actions select{width:100%}.card{padding:14px}}</style></head><body><section class="login" id="login"><form class="box" id="loginForm"><div class="brand"><img src="/images/kontanta-logo.png" alt=""><div><h1>Панель заявок</h1><p>Доступ только для уполномоченных сотрудников</p></div></div><label for="loginInput">Логин</label><input id="loginInput" autocomplete="username" required maxlength="100"><label for="passwordInput">Пароль</label><input id="passwordInput" type="password" autocomplete="current-password" required maxlength="256"><button class="btn wide" type="submit">Войти</button><p class="error" id="loginError" role="alert"></p></form></section><section class="app" id="app"><header class="top"><div class="wrap topin"><h1>КОНТАНТА · заявки</h1><div class="toolbar"><button class="btn install" id="install">Установить</button><button class="btn" id="refresh">Обновить</button><button class="btn" id="logout">Выйти</button></div></div></header><main class="wrap main"><div class="stats" id="stats"></div><div class="controls"><input id="search" type="search" placeholder="Поиск по ФИО или номеру" autocomplete="off"><select id="filter" aria-label="Фильтр по статусу"><option value="">Все статусы</option><option value="new">Новые</option><option value="processing">В работе</option><option value="completed">Завершённые</option><option value="rejected">Отклонённые</option></select></div><div class="cards" id="cards"></div><p class="privacy">Персональные данные доступны только уполномоченным сотрудникам. Не копируйте их в личные мессенджеры и не храните дольше установленного срока.</p></main></section><script>'use strict';const API='/api/';const login=document.getElementById('login'),app=document.getElementById('app'),form=document.getElementById('loginForm'),err=document.getElementById('loginError'),cards=document.getElementById('cards'),stats=document.getElementById('stats'),search=document.getElementById('search'),filter=document.getElementById('filter');let token=sessionStorage.getItem('kontanta_admin_token')||'',leads=[];const labels={new:'Новые',processing:'В работе',completed:'Завершённые',rejected:'Отклонённые'};function auth(){return{'Accept':'application/json','Authorization':'Bearer '+token}}async function request(path,options={}){options.headers={...auth(),...(options.headers||{})};const r=await fetch(API+path,options);let data={};try{data=await r.json()}catch(e){}if(r.status===401){leave();throw new Error('Сессия завершена. Войдите снова.')}if(!r.ok)throw new Error(data.error||'Ошибка запроса');return data}function enter(){login.style.display='none';app.style.display='block'}function leave(){token='';sessionStorage.removeItem('kontanta_admin_token');app.style.display='none';login.style.display='grid';form.reset()}function el(tag,text,cls){const x=document.createElement(tag);if(text!==undefined)x.textContent=text;if(cls)x.className=cls;return x}function renderStats(s){stats.replaceChildren();[['total','Всего'],['new','Новые'],['processing','В работе'],['completed','Завершено'],['rejected','Отклонено']].forEach(([key,label])=>{const x=el('div',undefined,'stat');x.append(el('b',String(s[key]||0)),el('span',label));stats.append(x)})}function render(){cards.replaceChildren();const q=search.value.trim().toLowerCase(),status=filter.value;const list=leads.filter(x=>(!status||(x.status||'new')===status)&&(!q||String(x.name||'').toLowerCase().includes(q)||String(x.phone||'').includes(q)));if(!list.length){cards.append(el('div','Заявок не найдено','empty'));return}list.forEach(lead=>{const card=el('article',undefined,'card'),row=el('div',undefined,'row'),left=el('div'),right=el('div');left.append(el('div',lead.name||'Без ФИО','name'));const phone=el('a',lead.phone||'');phone.className='phone';phone.href='tel:'+String(lead.phone||'').replace(/[^+\d]/g,'');left.append(phone);right.append(el('div',new Date(lead.created_at||Date.now()).toLocaleString('ru-RU'),'date'),el('div',lead.id||'','id'));row.append(left,right);card.append(row);if(lead.message)card.append(el('div',lead.message,'message'));const actions=el('div',undefined,'actions'),select=el('select');Object.entries(labels).forEach(([value,label])=>{const option=el('option',label);option.value=value;option.selected=(lead.status||'new')===value;select.append(option)});select.onchange=async()=>{select.disabled=true;try{await request('simple-leads.php?action=status',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:lead.id,status:select.value})});lead.status=select.value;await loadStats()}catch(e){alert(e.message)}finally{select.disabled=false}};const del=el('button','Удалить','btn danger');del.type='button';del.onclick=async()=>{if(!confirm('Безвозвратно удалить заявку?'))return;del.disabled=true;try{await request('simple-leads.php?action=delete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:lead.id})});leads=leads.filter(x=>x.id!==lead.id);render();await loadStats()}catch(e){alert(e.message)}finally{del.disabled=false}};actions.append(select,del);card.append(actions);cards.append(card)})}async function loadStats(){const d=await request('simple-stats.php');renderStats(d.stats||{})}async function load(){const d=await request('simple-leads.php?action=list');leads=d.leads||[];render();await loadStats()}form.onsubmit=async e=>{e.preventDefault();err.textContent='';const button=form.querySelector('button');button.disabled=true;try{const r=await fetch(API+'simple-auth.php?action=login',{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify({login:document.getElementById('loginInput').value,password:document.getElementById('passwordInput').value})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Не удалось войти');token=d.token;sessionStorage.setItem('kontanta_admin_token',token);enter();await load()}catch(e){err.textContent=e.message}finally{button.disabled=false}};document.getElementById('refresh').onclick=()=>load().catch(e=>alert(e.message));document.getElementById('logout').onclick=async()=>{try{await request('simple-auth.php?action=logout',{method:'POST'})}catch(e){}leave()};search.oninput=render;filter.onchange=render;(async()=>{if(!token)return;try{await request('simple-auth.php?action=verify');enter();await load()}catch(e){leave()}})();let prompt;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();prompt=e;document.getElementById('install').style.display='inline-block'});document.getElementById('install').onclick=async()=>{if(prompt){prompt.prompt();await prompt.userChoice;prompt=null;document.getElementById('install').style.display='none'}};if('serviceWorker'in navigator)navigator.serviceWorker.register('/service-worker-admin.js',{scope:'/'}).catch(()=>{});</script></body></html>
