<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <meta name="google" content="noindex">
    <title>КОНТАНТА | Система управления</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #0f172a;
            --secondary: #1e293b;
            --accent: #06b6d4;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --text: #f1f5f9;
            --border: #334155;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: var(--primary);
            color: var(--text);
            overflow-x: hidden;
        }

        .login-container {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
        }

        .login-box {
            width: 100%;
            max-width: 420px;
            padding: 40px;
            background: var(--secondary);
            border: 1px solid var(--border);
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        .login-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .login-header h1 {
            font-size: 32px;
            font-weight: 700;
            color: var(--accent);
            margin-bottom: 8px;
            letter-spacing: 2px;
        }

        .login-header p {
            color: #94a3b8;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #cbd5e1;
            font-size: 14px;
            font-weight: 500;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            background: var(--primary);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-size: 14px;
            transition: all 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(6, 182, 212, 0.1);
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            background: var(--accent);
            color: var(--primary);
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 20px;
        }

        .login-btn:hover {
            background: #0891b2;
            transform: translateY(-2px);
        }

        .login-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .alert {
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .alert-danger {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.5);
            color: #fca5a5;
        }

        .alert-success {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.5);
            color: #86efac;
        }

        /* Админка */
        .admin-layout {
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 0;
            min-height: 100vh;
        }

        .sidebar {
            background: var(--secondary);
            border-right: 1px solid var(--border);
            padding: 20px;
            overflow-y: auto;
        }

        .sidebar-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border);
        }

        .sidebar-header h2 {
            font-size: 18px;
            color: var(--accent);
            letter-spacing: 1px;
        }

        .nav-menu {
            list-style: none;
        }

        .nav-item {
            margin-bottom: 8px;
        }

        .nav-link {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            color: #cbd5e1;
            text-decoration: none;
            border-radius: 8px;
            transition: all 0.3s;
            cursor: pointer;
            background: none;
            border: none;
            width: 100%;
            text-align: left;
            font-size: 14px;
        }

        .nav-link:hover {
            background: rgba(6, 182, 212, 0.1);
            color: var(--accent);
        }

        .nav-link.active {
            background: rgba(6, 182, 212, 0.2);
            color: var(--accent);
            border-left: 3px solid var(--accent);
            padding-left: 13px;
        }

        .nav-icon {
            margin-right: 10px;
            font-size: 18px;
        }

        .main-content {
            padding: 30px;
            overflow-y: auto;
            background: var(--primary);
        }

        .header-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border);
        }

        .header-section h1 {
            font-size: 28px;
            font-weight: 700;
        }

        .logout-btn {
            background: var(--danger);
            color: white;
            padding: 8px 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }

        .logout-btn:hover {
            background: #dc2626;
        }

        /* Табы */
        .tabs {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
            border-bottom: 1px solid var(--border);
        }

        .tab-btn {
            padding: 12px 20px;
            background: none;
            border: none;
            color: #94a3b8;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            transition: all 0.3s;
        }

        .tab-btn.active {
            color: var(--accent);
            border-bottom-color: var(--accent);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* Таблицы */
        .table {
            width: 100%;
            border-collapse: collapse;
            background: var(--secondary);
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
        }

        .table th {
            background: rgba(6, 182, 212, 0.1);
            padding: 12px 16px;
            text-align: left;
            border-bottom: 1px solid var(--border);
            font-size: 12px;
            font-weight: 600;
            color: var(--accent);
        }

        .table td {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
        }

        .table tr:hover {
            background: rgba(6, 182, 212, 0.05);
        }

        /* Карточки */
        .card {
            background: var(--secondary);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border);
        }

        .card-title {
            font-size: 16px;
            font-weight: 600;
        }

        .stat-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: var(--secondary);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 20px;
            text-align: center;
        }

        .stat-value {
            font-size: 36px;
            font-weight: 700;
            color: var(--accent);
            margin-bottom: 8px;
        }

        .stat-label {
            font-size: 12px;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-sm {
            padding: 6px 12px;
            background: var(--accent);
            color: var(--primary);
            border: none;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-sm:hover {
            background: #0891b2;
        }

        .btn-danger-sm {
            background: var(--danger);
            color: white;
        }

        .btn-danger-sm:hover {
            background: #dc2626;
        }

        .loader {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid var(--border);
            border-radius: 50%;
            border-top-color: var(--accent);
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #94a3b8;
        }
    </style>
</head>
<body>
    <!-- Форма входа -->
    <div id="loginContainer" class="login-container">
        <div class="login-box">
            <div class="login-header">
                <h1>КОНТАНТА</h1>
                <p>Система управления</p>
            </div>

            <div id="loginAlert"></div>

            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="pathToken">Ключ доступа</label>
                    <input
                        type="password"
                        id="pathToken"
                        placeholder="Введите ключ доступа"
                        required
                    />
                </div>

                <div class="form-group">
                    <label for="password">Пароль</label>
                    <input
                        type="password"
                        id="password"
                        placeholder="Введите пароль"
                        required
                    />
                </div>

                <button type="submit" class="login-btn" id="loginBtn">
                    Вход
                </button>
            </form>
        </div>
    </div>

    <!-- Админка -->
    <div id="adminContainer" style="display: none;" class="admin-layout">
        <!-- Боковое меню -->
        <div class="sidebar">
            <div class="sidebar-header">
                <h2>КОНТАНТА</h2>
                <button class="logout-btn" onclick="handleLogout()">Выход</button>
            </div>

            <ul class="nav-menu">
                <li class="nav-item">
                    <button class="nav-link active" onclick="showTab('заявки')">
                        <span class="nav-icon">📋</span> Заявки
                    </button>
                </li>
                <li class="nav-item">
                    <button class="nav-link" onclick="showTab('аналитика')">
                        <span class="nav-icon">📊</span> Аналитика
                    </button>
                </li>
                <li class="nav-item">
                    <button class="nav-link" onclick="showTab('клиенты')">
                        <span class="nav-icon">👥</span> Клиенты
                    </button>
                </li>
                <li class="nav-item">
                    <button class="nav-link" onclick="showTab('звонки')">
                        <span class="nav-icon">☎️</span> Звонки
                    </button>
                </li>
                <li class="nav-item">
                    <button class="nav-link" onclick="showTab('логи')">
                        <span class="nav-icon">📝</span> Логи безопасности
                    </button>
                </li>
            </ul>
        </div>

        <!-- Основной контент -->
        <div class="main-content">
            <div class="header-section">
                <h1 id="pageTitle">Заявки</h1>
                <button class="logout-btn" onclick="handleLogout()">Выход</button>
            </div>

            <!-- Вкладка: Заявки -->
            <div id="заявки" class="tab-content active">
                <div class="stat-grid">
                    <div class="stat-card">
                        <div class="stat-value" id="statTotal">0</div>
                        <div class="stat-label">Всего заявок</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="statNew">0</div>
                        <div class="stat-label">Новых</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="statProcessing">0</div>
                        <div class="stat-label">Обработка</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="statCompleted">0</div>
                        <div class="stat-label">Завершено</div>
                    </div>
                </div>

                <div class="card">
                    <div class="card-header">
                        <div class="card-title">Список заявок</div>
                        <button class="btn-sm" onclick="loadLeads()">Обновить</button>
                    </div>
                    <div id="leadsTable"></div>
                </div>
            </div>

            <!-- Вкладка: Аналитика -->
            <div id="аналитика" class="tab-content">
                <div class="card">
                    <div class="card-header">
                        <div class="card-title">Общая статистика</div>
                        <button class="btn-sm" onclick="loadAnalytics()">Обновить</button>
                    </div>
                    <div id="analyticsContent"></div>
                </div>
            </div>

            <!-- Вкладка: Клиенты -->
            <div id="клиенты" class="tab-content">
                <div class="card">
                    <div class="card-header">
                        <div class="card-title">Анализ клиентов</div>
                        <button class="btn-sm" onclick="loadClientsAnalytics()">Обновить</button>
                    </div>
                    <div id="clientsContent"></div>
                </div>
            </div>

            <!-- Вкладка: Звонки -->
            <div id="звонки" class="tab-content">
                <div class="card">
                    <div class="card-header">
                        <div class="card-title">История звонков</div>
                        <button class="btn-sm" onclick="loadCalls()">Обновить</button>
                    </div>
                    <div id="callsContent"></div>
                </div>
            </div>

            <!-- Вкладка: Логи -->
            <div id="логи" class="tab-content">
                <div class="card">
                    <div class="card-header">
                        <div class="card-title">Логи безопасности</div>
                        <button class="btn-sm" onclick="loadLogs()">Обновить</button>
                    </div>
                    <div id="logsContent"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ============ ПЕРЕМЕННЫЕ СОСТОЯНИЯ ============
        let sessionToken = null;
        let currentTab = 'заявки';

        // ============ ИНИЦИАЛИЗАЦИЯ ============
        document.addEventListener('DOMContentLoaded', () => {
            // Восстанавливаем сессию, если она есть
            const savedSession = localStorage.getItem('admin_session');
            if (savedSession) {
                verifySession(savedSession);
            }
        });

        // ============ АВТОРИЗАЦИЯ ============
        async function handleLogin(e) {
            e.preventDefault();

            const pathToken = document.getElementById('pathToken').value;
            const password = document.getElementById('password').value;
            const loginBtn = document.getElementById('loginBtn');
            const alertDiv = document.getElementById('loginAlert');

            loginBtn.disabled = true;
            alertDiv.innerHTML = '';

            try {
                const response = await fetch('/api/admin-auth.php?action=login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ path_token: pathToken, password })
                });

                const data = await response.json();

                if (!response.ok) {
                    alertDiv.innerHTML = `<div class="alert alert-danger">${data.сообщение || 'Ошибка входа'}</div>`;
                } else {
                    sessionToken = data.сессия;
                    localStorage.setItem('admin_session', sessionToken);
                    
                    // Скрываем форму входа, показываем админку
                    document.getElementById('loginContainer').style.display = 'none';
                    document.getElementById('adminContainer').style.display = 'grid';
                    
                    // Загружаем данные
                    loadAllData();
                }
            } catch (error) {
                alertDiv.innerHTML = `<div class="alert alert-danger">Сетевая ошибка: ${error.message}</div>`;
            } finally {
                loginBtn.disabled = false;
            }
        }

        async function verifySession(session) {
            try {
                const response = await fetch(`/api/admin-auth.php?action=verify&session=${session}`);
                if (response.ok) {
                    sessionToken = session;
                    document.getElementById('loginContainer').style.display = 'none';
                    document.getElementById('adminContainer').style.display = 'grid';
                    loadAllData();
                } else {
                    localStorage.removeItem('admin_session');
                }
            } catch (error) {
                localStorage.removeItem('admin_session');
            }
        }

        function handleLogout() {
            if (confirm('Вы уверены, что хотите выйти?')) {
                localStorage.removeItem('admin_session');
                sessionToken = null;
                document.getElementById('adminContainer').style.display = 'none';
                document.getElementById('loginContainer').style.display = 'flex';
                document.getElementById('loginForm').reset();
            }
        }

        // ============ НАВИГАЦИЯ ============
        function showTab(tabName) {
            // Скрываем все вкладки
            document.querySelectorAll('.tab-content').forEach(tab => {
                tab.classList.remove('active');
            });

            // Удаляем активный класс с кнопок
            document.querySelectorAll('.nav-link').forEach(link => {
                link.classList.remove('active');
            });

            // Показываем нужную вкладку
            document.getElementById(tabName).classList.add('active');

            // Активируем кнопку навигации
            event.target.closest('.nav-link').classList.add('active');

            // Обновляем заголовок
            const titles = {
                'заявки': 'Заявки',
                'аналитика': 'Аналитика',
                'клиенты': 'Анализ клиентов',
                'звонки': 'История звонков',
                'логи': 'Логи безопасности'
            };
            document.getElementById('pageTitle').textContent = titles[tabName] || 'КОНТАНТА';

            currentTab = tabName;
        }

        // ============ ЗАГРУЗКА ДАННЫХ ============
        async function loadAllData() {
            await loadLeads();
            await loadAnalytics();
        }

        async function loadLeads() {
            try {
                const response = await fetch('/api/simple-leads.php?token=' + sessionToken + '&action=list');
                const data = await response.json();

                if (data.ok) {
                    const leads = data.leads;
                    
                    // Обновляем статистику
                    const stats = {
                        total: leads.length,
                        new: leads.filter(l => l.status === 'new').length,
                        processing: leads.filter(l => l.status === 'processing').length,
                        completed: leads.filter(l => l.status === 'completed').length
                    };

                    document.getElementById('statTotal').textContent = stats.total;
                    document.getElementById('statNew').textContent = stats.new;
                    document.getElementById('statProcessing').textContent = stats.processing;
                    document.getElementById('statCompleted').textContent = stats.completed;

                    // Выводим таблицу
                    let html = '<table class="table"><thead><tr><th>ID</th><th>Имя</th><th>Телефон</th><th>Email</th><th>Статус</th><th>Действия</th></tr></thead><tbody>';
                    
                    leads.forEach(lead => {
                        html += `<tr>
                            <td>${lead.id}</td>
                            <td>${lead.name}</td>
                            <td>${lead.phone}</td>
                            <td>${lead.email || '—'}</td>
                            <td><span style="color: #10b981;">${lead.status || 'новая'}</span></td>
                            <td>
                                <button class="btn-sm" onclick="viewLead(${lead.id})">Просмотр</button>
                                <button class="btn-sm btn-danger-sm" onclick="deleteLead(${lead.id})">Удалить</button>
                            </td>
                        </tr>`;
                    });

                    html += '</tbody></table>';
                    document.getElementById('leadsTable').innerHTML = html;
                }
            } catch (error) {
                console.error('Ошибка загрузки заявок:', error);
            }
        }

        async function loadAnalytics() {
            try {
                const response = await fetch('/api/simple-stats.php?token=' + sessionToken);
                const data = await response.json();

                if (data.ok) {
                    const stats = data.stats;
                    let html = `
                        <div style="display: grid; grid-template-columns: repeat(5, 1fr); gap: 20px;">
                            <div style="text-align: center; padding: 20px; background: var(--primary); border-radius: 8px;">
                                <div style="font-size: 24px; font-weight: bold; color: var(--accent);">${stats.total}</div>
                                <div style="color: #94a3b8; font-size: 12px;">Всего</div>
                            </div>
                            <div style="text-align: center; padding: 20px; background: var(--primary); border-radius: 8px;">
                                <div style="font-size: 24px; font-weight: bold; color: #10b981;">${stats.new}</div>
                                <div style="color: #94a3b8; font-size: 12px;">Новых</div>
                            </div>
                            <div style="text-align: center; padding: 20px; background: var(--primary); border-radius: 8px;">
                                <div style="font-size: 24px; font-weight: bold; color: #f59e0b;">${stats.processing}</div>
                                <div style="color: #94a3b8; font-size: 12px;">Обработка</div>
                            </div>
                            <div style="text-align: center; padding: 20px; background: var(--primary); border-radius: 8px;">
                                <div style="font-size: 24px; font-weight: bold; color: #3b82f6;">${stats.completed}</div>
                                <div style="color: #94a3b8; font-size: 12px;">Завершено</div>
                            </div>
                            <div style="text-align: center; padding: 20px; background: var(--primary); border-radius: 8px;">
                                <div style="font-size: 24px; font-weight: bold; color: #ef4444;">${stats.rejected}</div>
                                <div style="color: #94a3b8; font-size: 12px;">Отклонено</div>
                            </div>
                        </div>
                    `;
                    document.getElementById('analyticsContent').innerHTML = html;
                }
            } catch (error) {
                console.error('Ошибка загрузки аналитики:', error);
            }
        }

        async function loadClientsAnalytics() {
            const content = `
                <p style="color: #94a3b8;">Детальная информация по клиентам (cookies, браузер, геолокация и т.д.)</p>
                <div style="margin-top: 20px; padding: 20px; background: var(--primary); border-radius: 8px;">
                    <p>Система собирает:</p>
                    <ul style="margin-top: 10px; margin-left: 20px;">
                        <li>🔍 User-Agent и браузер информацию</li>
                        <li>🍪 Cookies и локальное хранилище</li>
                        <li>🎨 Canvas fingerprint</li>
                        <li>📍 IP адрес и геолокацию</li>
                        <li>⏱️ Временные зоны и язык</li>
                        <li>🖥️ Разрешение экрана</li>
                        <li>🛡️ Детектирование VPN/Proxy/TOR</li>
                    </ul>
                </div>
            `;
            document.getElementById('clientsContent').innerHTML = content;
        }

        async function loadCalls() {
            const content = `
                <p style="color: #94a3b8;">История всех звонков и контактов с клиентами</p>
                <div class="empty-state">
                    <p>Данные будут доступны после интеграции системы звонков</p>
                </div>
            `;
            document.getElementById('callsContent').innerHTML = content;
        }

        async function loadLogs() {
            try {
                // Пока заглушка
                const content = `
                    <div style="padding: 20px; background: var(--primary); border-radius: 8px; border: 1px solid var(--border);">
                        <p>📝 Логи всех входов в админку</p>
                        <p style="margin-top: 10px; color: #94a3b8; font-size: 12px;">IP адреса, время входа, попытки несанкционированного доступа</p>
                    </div>
                `;
                document.getElementById('logsContent').innerHTML = content;
            } catch (error) {
                console.error('Ошибка загрузки логов:', error);
            }
        }

        async function viewLead(leadId) {
            alert('Детальный просмотр заявки #' + leadId);
        }

        async function deleteLead(leadId) {
            if (confirm('Удалить заявку #' + leadId + '?')) {
                try {
                    const response = await fetch('/api/simple-leads.php?token=' + sessionToken + '&action=delete', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ lead_id: leadId })
                    });

                    if (response.ok) {
                        alert('Заявка удалена');
                        loadLeads();
                    }
                } catch (error) {
                    alert('Ошибка удаления: ' + error.message);
                }
            }
        }
    </script>
</body>
</html>
