name: Unpack project archive

on:
  push:
    paths:
      - .github/workflows/unpack-project.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract and prepare project
        id: extract
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          : > /tmp/unpack.log
          sudo apt-get update >>/tmp/unpack.log 2>&1
          sudo apt-get install -y p7zip-full rsync >>/tmp/unpack.log 2>&1
          mkdir -p extracted
          7z x -y kontanta-full-improved.zip -oextracted >>/tmp/unpack.log 2>&1

          shopt -s dotglob nullglob
          entries=(extracted/*)
          source_dir="extracted"
          if [ "${#entries[@]}" -eq 1 ] && [ -d "${entries[0]}" ]; then
            source_dir="${entries[0]}"
          fi

          rsync -a \
            --exclude='.git/' \
            --exclude='node_modules/' \
            --exclude='.next/' \
            --exclude='dist/' \
            --exclude='build/' \
            --include='.env.example' \
            --exclude='.env*' \
            "$source_dir"/ ./ >>/tmp/unpack.log 2>&1

          rm -rf extracted
          rm -f kontanta-full-improved.z01 kontanta-full-improved.z02 kontanta-full-improved.zip

      - name: Commit result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ steps.extract.outcome }}" = "success" ]; then
            rm -f UNPACK_STATUS.txt
          else
            {
              echo "Archive extraction failed."
              echo
              tail -n 100 /tmp/unpack.log 2>/dev/null || true
            } > UNPACK_STATUS.txt
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: extract project sources"
          git push
