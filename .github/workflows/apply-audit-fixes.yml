name: Apply audit fixes

on:
  push:
    paths:
      - .github/workflows/apply-audit-fixes.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Apply targeted fixes and cleanup
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, shutil

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  print(f'Pattern already absent: {path}')
                  return
              p.write_text(text.replace(old, new), encoding='utf-8')

          stats_type = '''interface Stats {\n  total: number;\n  new: number;\n  processing: number;\n  completed: number;\n  rejected: number;\n}\n\n'''
          replace('admin-panel/frontend/src/pages/DashboardPage.tsx', 'interface Lead {\n  id: number;\n  name: string;\n  phone: string;\n  email?: string;\n  message?: string;\n  status?: string;\n  created_at?: string;\n}\n\n', stats_type)
          replace('admin-panel/frontend/src/pages/DashboardPage.tsx', '  const { user, token } = useAuthStore();', '  const { token } = useAuthStore();')
          replace('admin-panel/frontend/src/pages/DashboardPage.tsx', 'useState(null)', 'useState<Stats | null>(null)')

          p = Path('admin-panel/frontend/src/pages/StatsPage.tsx')
          text = p.read_text(encoding='utf-8')
          marker = 'export default function StatsPage() {'
          if stats_type not in text:
              text = text.replace(marker, stats_type + marker)
          text = text.replace('  const { user, token } = useAuthStore();', '  const { token } = useAuthStore();')
          text = text.replace('useState(null)', 'useState<Stats | null>(null)')
          p.write_text(text, encoding='utf-8')

          for path in ['admin-panel/frontend/src/pages/ApplicationsPage.tsx', 'admin-panel/frontend/src/pages/CallsPage.tsx']:
              replace(path, '  const { user, token } = useAuthStore();', '  const { token } = useAuthStore();')

          replace('admin-panel/frontend/src/components/NotificationCenter.tsx', 'import { useEffect, useState } from "react";\n', '')
          replace('admin-panel/frontend/src/hooks/queries.ts', 'import { Application, Notification } from "../types";\n', '')
          replace('admin-panel/frontend/src/context/WebSocketProvider.tsx', '(data: { notificationId: string }) => {\n          setUnreadCount', '(_data: { notificationId: string }) => {\n          setUnreadCount')

          # Remove references to assets that do not exist; Vite generates the manifest.
          index = Path('admin-panel/frontend/index.html')
          text = index.read_text(encoding='utf-8')
          for line in [
              '    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />\n',
              '    <link rel="manifest" href="/manifest.json" />\n',
              '    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />\n',
              '    <link rel="icon" type="image/png" href="/icon-192.png" />\n',
          ]:
              text = text.replace(line, '')
          index.write_text(text, encoding='utf-8')

          vite = Path('admin-panel/frontend/vite.config.ts')
          text = vite.read_text(encoding='utf-8')
          text = text.replace('      includeAssets: ["favicon.ico", "apple-touch-icon.png"],\n', '')
          start = text.find('        icons: [')
          end = text.find('        categories:', start)
          if start != -1 and end != -1:
              text = text[:start] + text[end:]
          vite.write_text(text, encoding='utf-8')

          # Do not expose credentials or verbose server errors.
          replace('admin-panel/backend/src/server.ts', '  console.error("Error:", err);\n  res.status(err.status || 500).json({\n    error: err.message || "Internal server error",\n  });', '  console.error("Unhandled request error", err);\n  const status = Number.isInteger(err?.status) ? err.status : 500;\n  res.status(status).json({\n    error: status >= 500 ? "Internal server error" : err.message,\n  });')

          # Prevent clients from broadcasting forged application events.
          ws = Path('admin-panel/backend/src/services/websocket.service.ts')
          text = ws.read_text(encoding='utf-8')
          start = text.find('    /**\n     * Новая заявка (emit от сервера)')
          end = text.find('    /**\n     * Запрос уведомлений', start)
          if start != -1 and end != -1:
              text = text[:start] + '    // Application events are emitted by trusted server services only.\n\n' + text[end:]
          text = text.replace('        await prisma.notification.update({\n          where: { id: data.notificationId },\n          data: { readAt: new Date() },\n        });', '        const result = await prisma.notification.updateMany({\n          where: { id: data.notificationId, userId },\n          data: { readAt: new Date() },\n        });\n        if (result.count === 0) {\n          return socket.emit("error", { message: "Notification not found" });\n        }')
          ws.write_text(text, encoding='utf-8')

          # Remove confirmed legacy/test artifacts and generated reports.
          for item in [
              'root', 'контанта', 'package-lock.json',
              'api-test.html', 'test-admin-system.html', 'test-api-correct.html',
              'test-admin-api.sh', 'test-form.sh', 'check-rucentr.php',
              'generate_hash.php', 'ADMIN_START.html',
              'api/diagnostics.php', 'api/generate-admin-key.php',
              'api/reset-admin.php', 'api/test-auth.php', 'api/test-email-send.php',
              'AUDIT_RESULTS.md', 'VERIFY_RESULTS.md',
              '.github/workflows/audit-project.yml',
              '.github/workflows/verify-fixes.yml',
          ]:
              p = Path(item)
              if p.is_dir(): shutil.rmtree(p)
              elif p.exists(): p.unlink()

          # Runtime state and credentials must never be versioned.
          storage = Path('storage')
          for p in storage.iterdir():
              if p.name not in {'.gitkeep', '.htaccess'}:
                  if p.is_dir(): shutil.rmtree(p)
                  else: p.unlink()

          root_ignore = Path('.gitignore')
          root_ignore.write_text('''# Secrets and runtime state\n.env\n.env.*\n!.env.example\nstorage/*\n!storage/.gitkeep\n!storage/.htaccess\n\n# Dependencies and builds\nnode_modules/\ndist/\nbuild/\n.next/\n\n# Local tooling\n.DS_Store\nThumbs.db\n*.log\n''', encoding='utf-8')
          PY

      - name: Verify and create lockfiles
        shell: bash
        run: |
          set +e
          REPORT=FIX_RESULTS.md
          echo '# Audit fix verification' > "$REPORT"
          php_fail=0
          while IFS= read -r -d '' file; do
            output=$(php -l "$file" 2>&1)
            if [ $? -ne 0 ]; then
              php_fail=1
              printf '\nPHP failure `%s`\n```text\n%s\n```\n' "$file" "$output" >> "$REPORT"
            fi
          done < <(find . -type f -name '*.php' -not -path './.git/*' -print0)
          echo "PHP syntax status: $php_fail" >> "$REPORT"

          for app in admin-panel/backend admin-panel/frontend; do
            (
              cd "$app" || exit 1
              npm install --no-audit --no-fund >/tmp/install.log 2>&1
              i=$?
              npm run build >/tmp/build.log 2>&1
              b=$?
              echo "$app install=$i build=$b" >> "$GITHUB_WORKSPACE/$REPORT"
              if [ $i -ne 0 ]; then tail -n 120 /tmp/install.log >> "$GITHUB_WORKSPACE/$REPORT"; fi
              if [ $b -ne 0 ]; then tail -n 200 /tmp/build.log >> "$GITHUB_WORKSPACE/$REPORT"; fi
            )
          done

      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: resolve audit findings and remove legacy files"
          git push
