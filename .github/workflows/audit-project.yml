name: Audit project

on:
  push:
    paths:
      - .github/workflows/audit-project.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Run checks
        shell: bash
        run: |
          set +e
          REPORT="$GITHUB_WORKSPACE/AUDIT_RESULTS.md"
          echo '# Automated audit results' > "$REPORT"
          echo >> "$REPORT"
          echo "Commit: $GITHUB_SHA" >> "$REPORT"

          echo -e '\n## PHP syntax' >> "$REPORT"
          php_fail=0
          while IFS= read -r -d '' file; do
            result=$(php -l "$file" 2>&1)
            code=$?
            if [ $code -ne 0 ]; then
              php_fail=1
              printf '\n### `%s`\n```text\n%s\n```\n' "$file" "$result" >> "$REPORT"
            fi
          done < <(find . -type f -name '*.php' -not -path './.git/*' -print0)
          [ $php_fail -eq 0 ] && echo 'All PHP files passed `php -l`.' >> "$REPORT"

          echo -e '\n## JavaScript syntax' >> "$REPORT"
          js_fail=0
          while IFS= read -r -d '' file; do
            result=$(node --check "$file" 2>&1)
            code=$?
            if [ $code -ne 0 ]; then
              js_fail=1
              printf '\n### `%s`\n```text\n%s\n```\n' "$file" "$result" >> "$REPORT"
            fi
          done < <(find . -maxdepth 2 -type f -name '*.js' -not -path './.git/*' -print0)
          [ $js_fail -eq 0 ] && echo 'All standalone JavaScript files passed `node --check`.' >> "$REPORT"

          for app in admin-panel/backend admin-panel/frontend; do
            echo -e "\n## Build: $app" >> "$REPORT"
            if [ ! -f "$app/package.json" ]; then
              echo 'No package.json found.' >> "$REPORT"
              continue
            fi
            (
              cd "$app" || exit 1
              npm install --no-audit --no-fund > /tmp/npm-install.log 2>&1
              install_code=$?
              npm run build > /tmp/npm-build.log 2>&1
              build_code=$?
              printf 'Install exit code: `%s`\n\nBuild exit code: `%s`\n\n' "$install_code" "$build_code" >> "$REPORT"
              if [ $install_code -ne 0 ]; then
                echo '```text' >> "$REPORT"
                tail -n 120 /tmp/npm-install.log >> "$REPORT"
                echo '```' >> "$REPORT"
              fi
              if [ $build_code -ne 0 ]; then
                echo '```text' >> "$REPORT"
                tail -n 200 /tmp/npm-build.log >> "$REPORT"
                echo '```' >> "$REPORT"
              fi
            )
          done

          echo -e '\n## Broken local HTML references' >> "$REPORT"
          python3 - <<'PY' >> "$REPORT"
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import unquote

          root = Path('.').resolve()
          attrs = {'href', 'src', 'action', 'poster'}
          missing = []

          class Parser(HTMLParser):
              def __init__(self, file):
                  super().__init__()
                  self.file = file
              def handle_starttag(self, tag, pairs):
                  for key, value in pairs:
                      if key not in attrs or not value:
                          continue
                      value = value.strip()
                      if value.startswith(('#', 'http://', 'https://', '//', 'mailto:', 'tel:', 'data:', 'javascript:')):
                          continue
                      clean = unquote(value.split('#', 1)[0].split('?', 1)[0])
                      if not clean:
                          continue
                      target = root / clean.lstrip('/') if clean.startswith('/') else self.file.parent / clean
                      if not target.exists():
                          missing.append((self.file.as_posix(), value))

          for file in Path('.').rglob('*.html'):
              if '.git' in file.parts:
                  continue
              try:
                  Parser(file).feed(file.read_text(encoding='utf-8', errors='replace'))
              except Exception as exc:
                  missing.append((file.as_posix(), f'parse error: {exc}'))

          if missing:
              for file, ref in sorted(set(missing)):
                  print(f'- `{file}` → `{ref}`')
          else:
              print('No broken local references found.')
          PY

          echo -e '\n## Duplicate files' >> "$REPORT"
          python3 - <<'PY' >> "$REPORT"
          from pathlib import Path
          import hashlib
          groups = {}
          ignored = {'.git', 'node_modules', 'dist', 'build', '.next'}
          for p in Path('.').rglob('*'):
              if not p.is_file() or any(part in ignored for part in p.parts):
                  continue
              if p.name == 'AUDIT_RESULTS.md':
                  continue
              try:
                  digest = hashlib.sha256(p.read_bytes()).hexdigest()
              except OSError:
                  continue
              groups.setdefault((digest, p.stat().st_size), []).append(p.as_posix())
          found = False
          for (_, size), paths in groups.items():
              if len(paths) > 1 and size > 0:
                  found = True
                  print(f'- {size} bytes: ' + ', '.join(f'`{p}`' for p in paths))
          if not found:
              print('No exact duplicate non-empty files found.')
          PY

      - name: Commit report
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AUDIT_RESULTS.md
          git commit -m "chore: add automated audit results"
          git push
