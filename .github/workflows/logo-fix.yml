name: Place homepage logos

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  place-logos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Place both local logos
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '''            <a href="#" class="logo">
                <span class="logo-icon">К</span>
                КОНТАНТА
            </a>'''
          new = '''            <div class="brand-logos" aria-label="КОНТАНТА и Министерство обороны Российской Федерации">
                <a href="#top" class="brand-logo brand-logo-kontanta" aria-label="КОНТАНТА">
                    <img src="images/kontanta-logo.png" alt="КОНТАНТА" width="56" height="56" loading="eager" decoding="async" fetchpriority="high">
                    <span>КОНТАНТА</span>
                </a>
                <span class="brand-divider" aria-hidden="true"></span>
                <div class="brand-logo brand-logo-ministry">
                    <img src="images/mo-emblem.svg" alt="Министерство обороны Российской Федерации" width="56" height="56" loading="eager" decoding="async" fetchpriority="high">
                    <span>Министерство обороны РФ</span>
                </div>
            </div>'''
          if old not in s:
              raise SystemExit('Header logo markup changed; refusing unsafe replacement')
          s = s.replace(old, new, 1)
          css = '''
        /* Homepage partner logos */
        .brand-logos { display:flex; align-items:center; gap:14px; min-width:0; }
        .brand-logo { display:flex; align-items:center; gap:9px; min-height:56px; color:var(--text); font-family:'Cormorant Garamond',serif; font-weight:700; line-height:1.05; text-decoration:none; }
        .brand-logo img { display:block; flex:0 0 auto; width:56px; height:56px; object-fit:contain; }
        .brand-logo-kontanta > span { font-size:18px; letter-spacing:-.02em; }
        .brand-logo-ministry > span { max-width:130px; color:var(--text-secondary); font-family:'Inter',sans-serif; font-size:10px; font-weight:600; letter-spacing:.04em; text-transform:uppercase; }
        .brand-divider { width:1px; height:40px; background:var(--line); }
        @media (max-width:767px) {
            .brand-logos { gap:8px; }
            .brand-logo { min-height:44px; }
            .brand-logo img { width:44px; height:44px; }
            .brand-logo-kontanta > span { font-size:16px; }
            .brand-logo-ministry > span { display:none; }
            .brand-divider { height:32px; }
        }
        @media (max-width:420px) { .brand-logo-kontanta > span { display:none; } }

'''
          s = s.replace('</style>', css + '    </style>', 1)
          p.write_text(s, encoding='utf-8')
          PY
          test -s images/kontanta-logo.png
          test -s images/mo-emblem.svg
          grep -q 'src="images/kontanta-logo.png"' index.html
          grep -q 'src="images/mo-emblem.svg"' index.html
      - name: Commit verified placement and remove workflow
        run: |
          rm -f .github/workflows/logo-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: place both logos on homepage"
          git push
