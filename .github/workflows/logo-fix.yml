name: Update homepage copy, logos and FAQ

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-homepage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update homepage
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          def replace(old, new, label):
              global s
              if old not in s:
                  raise SystemExit(f'Cannot safely update {label}: expected text not found')
              s = s.replace(old, new, 1)

          replace('КОНТАНТА — контрактная служба при СВО. Полная информация и юридическая поддержка.',
                  'КОНТАНТА — помощь при поступлении на военную службу по контракту. Консультации по условиям, выплатам, документам и этапам оформления.', 'meta description')
          replace('<title>КОНТАНТА | Контрактная служба</title>',
                  '<title>КОНТАНТА | Военная служба по контракту</title>', 'title')

          replace('''            <a href="#" class="logo">
                <span class="logo-icon">К</span>
                КОНТАНТА
            </a>''', '''            <div class="brand-logos" aria-label="КОНТАНТА и Министерство обороны Российской Федерации">
                <a href="#top" class="brand-logo brand-logo-kontanta" aria-label="КОНТАНТА">
                    <img src="images/kontanta-logo.png" alt="КОНТАНТА" width="56" height="56" loading="eager" decoding="async" fetchpriority="high">
                    <span>КОНТАНТА</span>
                </a>
                <span class="brand-divider" aria-hidden="true"></span>
                <div class="brand-logo brand-logo-ministry">
                    <img src="images/mo-emblem.svg" alt="Министерство обороны Российской Федерации" width="56" height="56" loading="eager" decoding="async" fetchpriority="high">
                    <span>Министерство обороны РФ</span>
                </div>
            </div>''', 'logos')

          replace('''                <a href="#payouts">Выплаты</a>
                <a href="#process">Процесс</a>
                <a href="#specialties">Должности</a>
                <a href="#contacts">Контакты</a>''', '''                <a href="#payouts">Выплаты</a>
                <a href="#process">Как поступить</a>
                <a href="#benefits">Гарантии</a>
                <a href="#specialties">Специальности</a>
                <a href="#faq">Вопросы и ответы</a>
                <a href="#contacts">Контакты</a>''', 'navigation')

          replace('<div class="hero-subtitle">Контрактная служба при СВО</div>',
                  '<div class="hero-subtitle">Военная служба по контракту</div>', 'hero eyebrow')
          replace('<h1>Контракт<span>2.3M ₽</span></h1>',
                  '<h1>Служба<span>по контракту</span></h1>', 'hero heading')
          replace('''                Единовременная выплата 2 миллиона 300 тысяч рублей при подписании контракта. Полное консультирование, юридическое сопровождение и гарантия получения всех положенных выплат от Москвы и Федерации.''',
                  '''                Узнайте об условиях поступления, положенных выплатах, социальных гарантиях и необходимых документах. Поможем разобраться в этапах оформления и подготовиться к обращению в пункт отбора.''', 'hero description')
          replace('                    Хочу служить', '                    Подать заявку', 'primary button')
          replace('                    Хочу консультацию', '                    Получить консультацию', 'secondary button')
          replace('                    Связаться', '                    Позвонить специалисту', 'phone button')

          replace('<h2>Выплаты <span>при контракте</span></h2>\n                <p>Полная информация о размерах и сроках</p>',
                  '<h2>Денежные <span>выплаты</span></h2>\n                <p>Размер выплат зависит от места заключения контракта, должности, звания, выслуги и условий прохождения службы.</p>', 'payments heading')
          replace('Единовременно при подписании контракта (Указ Мэра Москвы от 23.07.2024)',
                  'Единовременная выплата Правительства Москвы военнослужащим, поступившим на службу в Москве.', 'Moscow payment')
          replace('Указ Президента РФ от 31.07.2024 № 644',
                  'При заключении контракта о прохождении военной службы на срок не менее одного года.', 'federal payment')
          replace('В зависимости от звания, должности и выслуги',
                  'Денежное довольствие зависит от воинской должности, звания, выслуги лет и других условий.', 'monthly pay')
          replace('Выплаты Правительства Москвы (Указ № 52-УМ)',
                  'Дополнительная ежемесячная выплата военнослужащим, поступившим на службу в Москве.', 'Moscow monthly pay')
          replace('''                    <p><strong>При подписании контракта вы получаете:</strong> единовременно <strong>2 300 000 рублей</strong> из федерального бюджета и бюджета Москвы.</p>
                    <p>Затем — ежемесячный оклад от 220 000 ₽ плюс дополнительные выплаты Москвы (50 000 ₽/мес) и премии за боевые результаты.</p>
                    <p style="margin-top: var(--gap-md); font-size: 13px; color: var(--text-secondary);">Согласно Указам Президента РФ и Мэра Москвы, документы опубликованы в официальных источниках.</p>''', '''                    <p><strong>При заключении контракта в Москве</strong> предусмотрены федеральная и московская единовременные выплаты.</p>
                    <p>Во время службы выплачивается денежное довольствие, а также дополнительные выплаты — их размер зависит от должности, звания, выслуги и выполняемых задач.</p>
                    <p style="margin-top: var(--gap-md); font-size: 13px; color: var(--text-secondary);">Условия и размеры выплат могут изменяться. Актуальную информацию уточняйте у специалиста перед оформлением.</p>''', 'payment summary')
          replace('<div class="total-label">При подписании</div>', '<div class="total-label">Единовременно в Москве</div>', 'payment total label')
          replace('Москва + Федерация<br><br><strong>Ежемесячно:</strong><br>220K+ + 50K = 270K+ ₽',
                  'Московская и федеральная выплаты<br><br><strong>Далее:</strong><br>денежное довольствие и дополнительные выплаты', 'payment total note')

          replace('<h2>Как это <span>работает</span></h2>\n                <p>Шесть шагов к подписанию контракта</p>',
                  '<h2>Как поступить <span>на службу</span></h2>\n                <p>Последовательные этапы от первой консультации до направления к месту службы.</p>', 'process heading')
          process_replacements = {
              'Оставляете контактные данные через форму': 'Оставьте заявку на сайте или свяжитесь с нами по телефону.',
              'Консультация с юристом и специалистом': 'Специалист расскажет об условиях, выплатах и порядке поступления.',
              'Сбор документов и медкомиссия': 'Подготовьте паспорт, военный билет и документы об образовании; пройдите отбор и медицинское освидетельствование.',
              'Подписание контракта в военкомате': 'После успешного отбора заключается контракт о прохождении военной службы.',
              'Получение единовременного пособия': 'После оформления начисляются предусмотренные единовременные выплаты.',
              'Начало контрактной деятельности': 'Пройдите подготовку и получите направление в воинскую часть.'
          }
          for old, new in process_replacements.items(): replace(old, new, 'process text')

          replace('<h2>Доступные <span>должности</span></h2>\n                <p>Список специальностей, где требуются контрактники</p>',
                  '<h2>Военные <span>специальности</span></h2>\n                <p>Конкретная должность определяется по результатам отбора с учетом образования, опыта, состояния здоровья и потребности подразделений.</p>', 'specialties heading')

          benefits = '''
    <!-- ГАРАНТИИ -->
    <section id="benefits">
        <div class="container">
            <div class="section-header">
                <h2>Льготы и <span>гарантии</span></h2>
                <p>Военнослужащим по контракту предоставляются государственные выплаты, социальные гарантии и меры поддержки.</p>
            </div>
            <div class="benefits-grid">
                <article class="benefit-card"><h3>Медицинское обеспечение</h3><p>Обследование, лечение и реабилитация в военно-медицинских учреждениях, обеспечение лекарствами и медицинскими изделиями.</p></article>
                <article class="benefit-card"><h3>Страхование</h3><p>Жизнь и здоровье военнослужащего подлежат обязательному государственному страхованию.</p></article>
                <article class="benefit-card"><h3>Статус ветерана</h3><p>При наличии предусмотренных законом оснований предоставляется статус ветерана боевых действий и соответствующие льготы.</p></article>
                <article class="benefit-card"><h3>Жилищное обеспечение</h3><p>Возможность участия в накопительно-ипотечной системе и получение компенсации за наем жилья в предусмотренных случаях.</p></article>
                <article class="benefit-card"><h3>Образование и работа</h3><p>Доступны меры поддержки при поступлении в образовательные организации, переобучении и дальнейшем трудоустройстве.</p></article>
                <article class="benefit-card"><h3>Поддержка семьи</h3><p>Для членов семей действуют федеральные и региональные меры социальной поддержки.</p></article>
            </div>
        </div>
    </section>

'''
          replace('    <!-- ДОЛЖНОСТИ -->', benefits + '    <!-- ДОЛЖНОСТИ -->', 'benefits section')

          faq = '''
    <!-- ВОПРОСЫ И ОТВЕТЫ -->
    <section id="faq">
        <div class="container faq-container">
            <div class="section-header">
                <h2>Вопросы <span>и ответы</span></h2>
                <p>Краткие ответы на частые вопросы о поступлении на военную службу по контракту.</p>
            </div>
            <div class="faq-list">
                <details><summary>Кто может поступить на военную службу по контракту?</summary><div class="faq-answer"><p>Граждане России и иностранные граждане, соответствующие установленным требованиям по возрасту, состоянию здоровья, профессиональной пригодности и другим условиям. Решение принимается по результатам отбора.</p></div></details>
                <details><summary>Какие документы могут понадобиться?</summary><div class="faq-answer"><p>Обычно требуются паспорт, военный билет при наличии, документ об образовании, фотографии и документы о семейном положении. Точный перечень лучше уточнить перед посещением пункта отбора.</p></div></details>
                <details><summary>Как определяется военная специальность?</summary><div class="faq-answer"><p>Специальность и должность подбираются с учетом образования, навыков, опыта, результатов профессионального и медицинского отбора, а также текущей потребности подразделений.</p></div></details>
                <details><summary>Какие выплаты предусмотрены?</summary><div class="faq-answer"><p>Предусмотрены единовременные и ежемесячные выплаты. Их размер зависит от региона оформления, должности, звания, выслуги, места и условий прохождения службы.</p></div></details>
                <details><summary>Предоставляются ли социальные гарантии?</summary><div class="faq-answer"><p>Да. Военнослужащим предоставляются медицинское и вещевое обеспечение, государственное страхование, отпуск и другие гарантии. Дополнительные меры поддержки могут распространяться на членов семьи.</p></div></details>
                <details><summary>Нужно ли проходить подготовку?</summary><div class="faq-answer"><p>Перед направлением к месту службы военнослужащие проходят необходимую подготовку. Ее программа и продолжительность зависят от специальности и подразделения.</p></div></details>
                <details><summary>Как получить консультацию?</summary><div class="faq-answer"><p>Позвоните по указанному на сайте номеру или оставьте заявку. Специалист свяжется с вами и ответит на вопросы об условиях и порядке оформления.</p></div></details>
            </div>
        </div>
    </section>

'''
          replace('    <!-- КОНТАКТЫ -->', faq + '    <!-- КОНТАКТЫ -->', 'FAQ section')

          replace('<h2>Контакты</h2>\n                <p>Свяжитесь с нами для консультации</p>',
                  '<h2>Получить консультацию</h2>\n                <p>Свяжитесь с нами удобным способом — ответим на вопросы и расскажем о дальнейших шагах.</p>', 'contacts heading')
          replace('Звоните в рабочее время', 'Позвоните, чтобы уточнить условия и записаться на консультацию.', 'phone description')
          replace('Отвечаем в течение часа', 'Напишите нам — специалист ответит и поможет разобраться в порядке оформления.', 'email description')
          replace('м. Щёлковская, Москва', 'Консультация и сопровождение по вопросам поступления на службу по контракту.', 'address description')
          replace('<h2>Оставить заявку</h2>\n            <p>Наш специалист свяжется с вами в течение одного часа</p>',
                  '<h2>Оставить заявку</h2>\n            <p>Укажите контактные данные — специалист свяжется с вами, ответит на вопросы и расскажет о дальнейших шагах.</p>', 'modal heading')
          replace('placeholder="Ваш возраст"', 'placeholder="Например, 30"', 'age placeholder')
          replace('placeholder="Расскажите о себе, опыте, причине интереса..."', 'placeholder="Напишите, какой вопрос вас интересует"', 'message placeholder')
          replace('<button type="submit" class="form-submit">Отправить</button>', '<button type="submit" class="form-submit">Отправить заявку</button>', 'submit button')
          replace('Контрактная служба при СВО. Полная информация, юридическая поддержка, гарантия получения выплат.',
                  'Помощь при поступлении на военную службу по контракту: консультация по условиям, выплатам, документам и этапам оформления.', 'footer text')
          replace('© 2024 КОНТАНТА. Выплаты при контрактной службе от 2.3 млн ₽',
                  '© 2026 КОНТАНТА. Информация на сайте носит справочный характер; актуальные условия уточняйте перед оформлением.', 'footer legal text')

          css = '''
        /* Brand logos */
        .brand-logos { display:flex; align-items:center; gap:14px; min-width:0; }
        .brand-logo { display:flex; align-items:center; gap:9px; min-height:56px; color:var(--text); font-family:'Cormorant Garamond',serif; font-weight:700; line-height:1.05; text-decoration:none; }
        .brand-logo img { display:block; flex:0 0 auto; width:56px; height:56px; object-fit:contain; }
        .brand-logo-kontanta > span { font-size:18px; letter-spacing:-.02em; }
        .brand-logo-ministry > span { max-width:130px; color:var(--text-secondary); font-family:'Inter',sans-serif; font-size:10px; font-weight:600; letter-spacing:.04em; text-transform:uppercase; }
        .brand-divider { width:1px; height:40px; background:var(--line); }

        /* Benefits and FAQ */
        .benefits-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:var(--gap-md); }
        .benefit-card { padding:var(--gap-md); background:var(--surface-2); border:1px solid var(--line); border-top:3px solid var(--primary); }
        .benefit-card h3 { margin-bottom:var(--gap-sm); font-family:'Cormorant Garamond',serif; font-size:27px; line-height:1.1; }
        .benefit-card p { color:var(--text-secondary); font-size:14px; line-height:1.7; }
        .faq-container { max-width:980px; }
        .faq-list { border-top:1px solid var(--line); }
        .faq-list details { border-bottom:1px solid var(--line); }
        .faq-list summary { position:relative; padding:25px 52px 25px 0; cursor:pointer; list-style:none; font-size:18px; font-weight:600; color:var(--text); }
        .faq-list summary::-webkit-details-marker { display:none; }
        .faq-list summary::after { content:'+'; position:absolute; right:8px; top:50%; transform:translateY(-50%); color:var(--gold); font-size:30px; font-weight:300; }
        .faq-list details[open] summary::after { content:'−'; }
        .faq-answer { padding:0 52px 25px 0; color:var(--text-secondary); font-size:15px; line-height:1.8; }
        .faq-list summary:focus-visible { outline:2px solid var(--gold); outline-offset:4px; }

        @media (max-width:900px) { .benefits-grid { grid-template-columns:repeat(2,1fr); } }
        @media (max-width:767px) {
            .brand-logos { gap:8px; }
            .brand-logo { min-height:44px; }
            .brand-logo img { width:44px; height:44px; }
            .brand-logo-kontanta > span { font-size:16px; }
            .brand-logo-ministry > span { display:none; }
            .brand-divider { height:32px; }
            .benefits-grid { grid-template-columns:1fr; }
            .faq-list summary { font-size:16px; }
        }
        @media (max-width:420px) { .brand-logo-kontanta > span { display:none; } }

'''
          replace('    </style>', css + '    </style>', 'styles')
          p.write_text(s, encoding='utf-8')
          PY

          test -s images/kontanta-logo.png
          test -s images/mo-emblem.svg
          grep -q 'id="faq"' index.html
          grep -q 'id="benefits"' index.html
          grep -q 'src="images/kontanta-logo.png"' index.html
          grep -q 'src="images/mo-emblem.svg"' index.html
          test "$(grep -c '<details>' index.html)" -eq 7

      - name: Commit verified update and remove workflow
        run: |
          rm -f .github/workflows/logo-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: improve homepage copy and add FAQ"
          git push
