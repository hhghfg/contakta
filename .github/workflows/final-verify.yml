name: Final verification

on:
  push:
    paths:
      - .github/workflows/final-verify.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify project
        shell: bash
        run: |
          set +e
          fail=0
          log=/tmp/final-verification.log
          : > "$log"

          while IFS= read -r -d '' file; do
            php -l "$file" >>"$log" 2>&1 || fail=1
          done < <(find . -type f -name '*.php' -not -path './.git/*' -print0)

          while IFS= read -r -d '' file; do
            node --check "$file" >>"$log" 2>&1 || fail=1
          done < <(find . -maxdepth 2 -type f -name '*.js' -not -path './.git/*' -print0)

          for app in admin-panel/backend admin-panel/frontend; do
            (
              cd "$app" || exit 1
              npm ci --no-audit --no-fund >>"$log" 2>&1 && npm run build >>"$log" 2>&1
            ) || fail=1
          done

          if [ "$fail" -eq 0 ]; then
            rm -f FINAL_RESULTS.md FIX_RESULTS.md VERIFY_RESULTS.md AUDIT_RESULTS.md
            rm -f .github/workflows/apply-audit-fixes.yml
            rm -f .github/workflows/final-verify.yml
          else
            {
              echo '# Final verification failed'
              echo
              echo '```text'
              tail -n 250 "$log"
              echo '```'
            } > FINAL_RESULTS.md
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          if [ "$fail" -eq 0 ]; then
            git commit -m "chore: remove temporary audit files"
          else
            git commit -m "chore: record final verification failure"
          fi
          git push
          exit "$fail"
